name: Bootstrap Freqtrade Foundation

"on":
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/bootstrap-freqtrade.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Clone Freqtrade upstream baseline
        shell: bash
        run: |
          set -euo pipefail

          # IMPORTANT: stage upstream outside the checked-out repository.
          # The previous implementation cloned into .upstream-freqtrade and then
          # used rsync --delete against ./, which made rsync treat its own source
          # directory as a destination-only directory and delete files while it
          # was still scanning them. That produced the "file has vanished" errors.
          UPSTREAM_DIR="$(mktemp -d)"
          trap 'rm -rf "$UPSTREAM_DIR"' EXIT

          git clone --depth 1 --branch develop https://github.com/freqtrade/freqtrade.git "$UPSTREAM_DIR"
          UPSTREAM_SHA="$(git -C "$UPSTREAM_DIR" rev-parse HEAD)"
          printf '%s\n' "$UPSTREAM_SHA" > .freqtrade-upstream-commit
          rm -rf "$UPSTREAM_DIR/.git"

          # Import the upstream source tree but deliberately exclude GitHub Actions
          # workflows. The GitHub App used by this repository has contents:write but
          # does not have the workflows permission required to create/update workflow files.
          # Do NOT use --delete: this repository contains project-specific files that
          # must survive the upstream import.
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            "$UPSTREAM_DIR/" ./

          mkdir -p docs architecture configs data models tests
          printf '%s\n' \
            '# Freqtrade Upstream Baseline' \
            '' \
            'This repository is based on the Freqtrade develop branch.' \
            '' \
            'Upstream repository: https://github.com/freqtrade/freqtrade' \
            "Baseline commit: $UPSTREAM_SHA" \
            '' \
            'The upstream code is retained as the initial trading-engine foundation. BrAInChain-specific functionality will be added in isolated modules and feature branches wherever practical.' \
            > docs/UPSTREAM.md

          git add -A
          git commit -m "chore: bootstrap Freqtrade upstream foundation"
          git push origin HEAD:main
