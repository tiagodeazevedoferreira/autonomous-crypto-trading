name: BrAInChain Integration Tests

"on":
  push:
    branches: [main, develop, 'feat/**']
  pull_request:

permissions:
  contents: read

jobs:
  test-external-intelligence-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run BrAInChain integration-boundary tests
        run: python -m unittest discover -s tests -p 'test_brainchain_*.py' -v
